
name: TradeX CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:

  # ==========================================
  # STAGE 1-5: Test and Build
  # ==========================================
  test-and-build:
    name: Test & Build (Frontend & Backend)
    runs-on: ubuntu-latest

    steps:
      - name: "Stage 1: Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Stage 2: Set up Node.js 20.x"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: "Stage 4A: Run Backend Tests"
        working-directory: ./backend
        run: npm test

      - name: "Stage 4B: Run Frontend Tests"
        working-directory: ./frontend
        run: npm test

      - name: "Stage 5: Build Frontend"
        working-directory: ./frontend
        run: npm run build


  # ==========================================
  # STAGE 6: Docker Validation
  # ==========================================
  docker-validation:
    name: Docker Build & Configuration Validation
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: tradex-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: tradex-frontend:test


  # ==========================================
  # STAGE 7: Native Multi-Platform Image Builds
  # ==========================================
  publish-images:
    name: Build Native Multi-Platform Images
    needs: docker-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            suffix: amd64
            platform: linux/amd64

          - runner: ubuntu-24.04-arm
            suffix: arm64
            platform: linux/arm64

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Name
        id: repo-name
        run: |
          echo "IMAGE_REPOSITORY=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo-name.outputs.IMAGE_REPOSITORY }}/backend:latest-${{ matrix.suffix }}
            ghcr.io/${{ steps.repo-name.outputs.IMAGE_REPOSITORY }}/backend:sha-${{ github.sha }}-${{ matrix.suffix }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo-name.outputs.IMAGE_REPOSITORY }}/frontend:latest-${{ matrix.suffix }}
            ghcr.io/${{ steps.repo-name.outputs.IMAGE_REPOSITORY }}/frontend:sha-${{ github.sha }}-${{ matrix.suffix }}


  # ==========================================
  # STAGE 7B: Create Multi-Platform Manifests
  # ==========================================
  create-manifests:
    name: Create Multi-Platform Manifests
    needs: publish-images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Name
        id: repo-name
        run: |
          echo "IMAGE_REPOSITORY=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Create Multi-Platform Manifests
        env:
          IMAGE_REPOSITORY: ${{ steps.repo-name.outputs.IMAGE_REPOSITORY }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          REPO="ghcr.io/${IMAGE_REPOSITORY}"

          docker buildx imagetools create \
            --tag "${REPO}/backend:latest" \
            "${REPO}/backend:latest-amd64" \
            "${REPO}/backend:latest-arm64"

          docker buildx imagetools create \
            --tag "${REPO}/frontend:latest" \
            "${REPO}/frontend:latest-amd64" \
            "${REPO}/frontend:latest-arm64"

          docker buildx imagetools create \
            --tag "${REPO}/backend:sha-${IMAGE_SHA}" \
            "${REPO}/backend:sha-${IMAGE_SHA}-amd64" \
            "${REPO}/backend:sha-${IMAGE_SHA}-arm64"

          docker buildx imagetools create \
            --tag "${REPO}/frontend:sha-${IMAGE_SHA}" \
            "${REPO}/frontend:sha-${IMAGE_SHA}-amd64" \
            "${REPO}/frontend:sha-${IMAGE_SHA}-arm64"


  # ==========================================
  # STAGE 8: Cloud Deployment
  # ==========================================
  deploy:
    name: Deploy to Cloud Server
    needs: create-manifests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check Deployment Credentials
        id: check-secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "SSH Deployment secrets configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deployment credentials not configured. Skipping deployment."
          fi

      - name: Execute Remote Deployment via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /opt/tradex || exit 1
            git pull origin main
            docker compose pull
            docker compose up -d
            docker system prune -f
