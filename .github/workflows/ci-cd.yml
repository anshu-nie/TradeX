name: TradeX CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # ==========================================
  # STAGE 1 - 5: Lint, Test & Build Frontend/Backend
  # ==========================================
  test-and-build:
    name: Test & Build (Frontend & Backend)
    runs-on: ubuntu-latest
    steps:
      - name: "Stage 1: Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Stage 2: Set up Node.js 20.x"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: "Stage 4A: Run Automated Backend Tests (Jest & In-Memory MongoDB)"
        working-directory: ./backend
        run: npm test

      - name: "Stage 4B: Run Automated Frontend Tests (Vitest & RTL)"
        working-directory: ./frontend
        run: npm test

      - name: "Stage 5: Compile Production Frontend Artifacts"
        working-directory: ./frontend
        run: npm run build

  # ==========================================
  # STAGE 6: Docker Build & Compose Validation
  # ==========================================
  docker-validation:
    name: Docker Build & Configuration Validation
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: tradex-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: tradex-frontend:test

  # ==========================================
  # STAGE 7: Publish Container Images to GHCR (Main branch only)
  # ==========================================
  publish-images:
    name: Publish Images to GitHub Container Registry
    needs: docker-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name for GHCR
        id: repo-name
        run: |
          echo "IMAGE_REPOSITORY=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract Metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo-name.outputs.IMAGE_REPOSITORY }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Extract Metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo-name.outputs.IMAGE_REPOSITORY }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  # ==========================================
  # STAGE 8: Automated Cloud Deployment (Optional on configured SSH credentials)
  # ==========================================
  deploy:
    name: Deploy to Cloud Server
    needs: [docker-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Credentials
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ] && [ -n "${{ secrets.DEPLOY_USER }}" ] && [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "SSH Deployment secrets configured."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "SSH Deployment credentials not set. Skipping live remote deployment."
          fi

      - name: Execute Remote Deployment via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /opt/tradex || exit 1
            git pull origin main
            docker compose pull || true
            docker compose up -d --build
            docker system prune -f
