services:
  mongodb:
    image: mongo:7.0
    container_name: tradex-dev-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tradex
    volumes:
      - dev-mongo-data:/data/db
    networks:
      - tradex-dev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradex-dev-backend
    command: npm run dev
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/tradex
      JWT_SECRET: dev_secret_key_tradex_academic_2026
    depends_on:
      - mongodb
    networks:
      - tradex-dev-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradex-dev-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
    depends_on:
      - backend
    networks:
      - tradex-dev-network

networks:
  tradex-dev-network:
    driver: bridge

volumes:
  dev-mongo-data:
    driver: local
