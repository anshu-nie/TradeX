version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: tradex-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tradex
    volumes:
      - mongo-data:/data/db
    networks:
      - tradex-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Express.js REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradex-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/tradex
      JWT_SECRET: tradex_production_secret_key_change_in_real_env_2026
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
      MARKET_DATA_API_KEY: ""
      NEWS_API_KEY: ""
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - tradex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # React Production Frontend Service with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradex-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tradex-network

networks:
  tradex-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
